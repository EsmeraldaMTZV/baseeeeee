{% extends "index.html" %}

{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="card" style="width: 18rem;">
                <img src= "static/img/usu.webp" class="card-img-top mx-auto mt-4" alt=" " style="width: 100px;">"
                <div class="card-body">
                    <h2 class="card-title text-center mb-4 text-primary">
                        Acceso de Usuarios
                    </h2>
                    
                    <form action="/login" method="POST">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label visually-hidden">Usuario</label>
                            <input type="text" 
                        id="username" 
                        name="username" 
                        class="form-control"
                        placeholder="Usuario o correo electrónico" 
                        required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label visually-hidden">Contraseña</label>
                            <input type="password" 
                                   id="password" 
                                   name="password" 
                                   class="form-control"
                                   placeholder="Contraseña" 
                                   required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                Iniciar Sesión
                            </button>
                        </div>

                        <hr class="my-4">

                        <div class="text-center small">
                            <a href="/forgot-password" class="text-muted d-block">¿Olvidaste tu contraseña?</a>
                            <a href="/register" class="text-primary d-block mt-1">Crear una cuenta</a>
                        </div>
                    </form>
                </div>
            </div>
            </div>
    </div>
</div>
{% endblock content %}
